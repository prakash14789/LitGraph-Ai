# LitGraph Docker Compose — Cloud Architecture Setup
# NOTE: PostgreSQL, Neo4j, ChromaDB, and Redis local containers have been migrated to managed cloud services:
# - PostgreSQL -> Supabase Cloud (DATABASE_URL)
# - Neo4j -> Neo4j AuraDB Cloud (NEO4J_URI)
# - ChromaDB -> Qdrant Cloud (QDRANT_URL, QDRANT_API_KEY)
# - Redis -> Upstash Cloud (REDIS_URL)
# See implementation_plan.md for full cloud migration documentation.

services:
  backend:
    image: prakash7976/litgraph-backend:latest
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data

  celery_worker:
    image: prakash7976/litgraph-backend:latest
    build: .
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=info
    env_file: .env
    volumes:
      - ./data:/app/data
