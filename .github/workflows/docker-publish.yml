name: Build and push Docker image

# Single Dockerfile builds one image used by both the `backend` (uvicorn)
# and `celery_worker` (celery) services in docker-compose.yml — only the
# command differs, so only one image needs building/pushing here.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "poetry.lock"
      - "src/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            prakash7976/litgraph-backend:latest
            prakash7976/litgraph-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
