[tool.poetry]
name = "litgraph"
version = "0.1.0"
description = "GraphRAG for academic literature — ingests papers, builds a knowledge graph, and answers multi-hop questions vector-RAG can't."
authors = ["Prakash"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
