[tool.poetry]
name = "litgraph"
version = "0.1.0"
description = "GraphRAG for academic literature — ingests papers, builds a knowledge graph, and answers multi-hop questions vector-RAG can't."
authors = ["Prakash"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic-settings = "^2.6"
structlog = "^24.4"
asyncpg = "^0.30"
neo4j = "^5.26"
httpx = "^0.27"
sqlalchemy = "^2.0"
alembic = "^1.13"
chromadb = "^1.0"
sentence-transformers = "^3.2"
openai = "^1.54"
celery = { extras = ["redis"], version = "^5.4" }
pymupdf = "^1.24"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"
pytest-cov = "^5.0"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"
